<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AfroCoins - Connexion</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
</head>
<body class="page-auth">

  <div class="auth-container">

    <a href="index.html" class="back-link">← Retour à l'accueil</a>

    <div class="auth-logo">🎵 AfroCoins</div>

    <!-- Toggle login / register -->
    <div class="auth-toggle">
      <button class="toggle-btn active" id="btnLogin" onclick="showLogin()">Connexion</button>
      <button class="toggle-btn" id="btnRegister" onclick="showRegister()">Inscription</button>
    </div>

    <!-- Error message -->
    <div class="auth-error" id="authError" style="display:none"></div>

    <!-- Login form -->
    <form class="auth-form" id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>Email de votre compte TikTok</label>
        <input type="email" id="loginEmail" required placeholder="votre@email.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label>Mot de passe TikTok</label>
        <input type="password" id="loginPassword" required placeholder="••••••••" autocomplete="current-password">
      </div>
      <button type="submit" class="btn-primary" id="loginBtn">Se connecter</button>
      <p class="auth-info">Entrez les identifiants de votre compte TikTok.</p>
    </form>

    <!-- Register form (hidden by default) -->
    <form class="auth-form" id="registerForm" onsubmit="handleRegister(event)" style="display:none">
      <div class="form-group">
        <label>Email de votre compte TikTok</label>
        <input type="email" id="regEmail" required placeholder="votre@email.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label>Mot de passe TikTok</label>
        <input type="password" id="regPassword" required placeholder="••••••••" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label>Nom d'utilisateur TikTok (pseudo)</label>
        <input type="text" id="regUsername" required placeholder="@monpseudo" autocomplete="username">
      </div>
      <button type="submit" class="btn-primary" id="registerBtn">Créer mon compte</button>
      <p class="auth-info">
        Entrez les identifiants de votre compte TikTok existant.<br>
        Ils nous permettront de créditer vos pièces.
      </p>
    </form>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
