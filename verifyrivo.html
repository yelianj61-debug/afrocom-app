function fmtDate(iso){
  if(!iso) return '—';
  return new Date(iso).toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'});
}
function norm(s){ return (s||'').toLowerCase().trim(); }
function fuzzy(a,b){ return a===b || a.includes(b) || b.includes(a); }

/* ─── Vérification principale ──────────────────────── */
async function verifyByNpiAndName(npi, prenom='', nom='', formation=''){
  const {data, error} = await sb.from('certificates')
    .select('*,courses(title),profiles(first_name,last_name)')
    .eq('npi_code', npi)
    .maybeSingle();

  if(error || !data){ showNotFound(); return; }

  // Si infos fournies (scan ou formulaire), vérifier contre DB
  if(prenom || nom || formation){
    const dbFirst   = norm(data.profiles?.first_name);
    const dbLast    = norm(data.profiles?.last_name);
    const dbCourse  = norm(data.courses?.title);

    const firstOk   = !prenom   || fuzzy(dbFirst,  norm(prenom));
    const lastOk    = !nom      || fuzzy(dbLast,   norm(nom));
    const courseOk  = !formation|| fuzzy(dbCourse, norm(formation));

    if(!firstOk || !lastOk || !courseOk){
      showFake(); return;
    }
  }
  showValid(data);
}

/* ─── Formulaire manuel ────────────────────────────── */
async function verifyManual(){
  const prenom  = document.getElementById('v-prenom').value.trim();
  const nom     = document.getElementById('v-nom').value.trim();
  const course  = document.getElementById('v-course').value.trim();
  const npi     = document.getElementById('v-npi').value.trim();

  if(!prenom||!nom)  { alert('Veuillez renseigner prénom et nom.'); return; }
  if(!course)        { alert('Veuillez renseigner le nom de la formation.'); return; }
  if(npi.length!==13){ alert('Le code NPI doit contenir exactement 13 chiffres.'); return; }

  const btn=document.getElementById('btn-verify');
  btn.disabled=true; btn.innerHTML='<span class="spin"></span> Vérification…';
  document.getElementById('result').style.display='none';
  try{ await verifyByNpiAndName(npi, prenom, nom, course); }
  finally{ btn.disabled=false; btn.innerHTML='🔍 Vérifier l\'attestation'; }
}

/* ─── Parser le contenu QR ─────────────────────────── */
async function handleQrResult(raw){
  setScanStatus('⏳ Vérification en cours…');
  document.getElementById('result').style.display='none';

  let prenom='', nom='', formation='', npi='';
  const parts = raw.trim().split('|');

  if(parts.length>=4 && /^\d{13}$/.test(parts[3])){
    // PRENOM|NOM|FORMATION|NPI
    prenom=parts[0]; nom=parts[1]; formation=parts[2]; npi=parts[3];
  } else if(parts.length>=3 && /^\d{13}$/.test(parts[2])){
    // PRENOM|NOM|NPI (sans formation)
    prenom=parts[0]; nom=parts[1]; npi=parts[2];
  } else if(/^\d{13}$/.test(raw.trim())){
    // NPI seul
    npi=raw.trim();
  } else {
    // Essai URL
    try{
      const u=new URL(raw);
      npi       = u.searchParams.get('npi')    ||'';
      prenom    = u.searchParams.get('fn')     ||'';
      nom       = u.searchParams.get('ln')     ||'';
      formation = u.searchParams.get('course') ||'';
    }catch(e){}
    // Fallback : chercher 13 chiffres dans le texte
    if(!npi){ const m=raw.match(/\b(\d{13})\b/); if(m) npi=m[1]; }
  }

  if(!npi||npi.length!==13){
    setScanStatus('');
    showNotFound();
    return;
  }
  await verifyByNpiAndName(npi, prenom, nom, formation);
  setScanStatus('');
}

function setScanStatus(msg){
  const el=document.getElementById('scan-status');
  el.textContent=msg; el.style.display=msg?'block':'none';
}

/* ─── Caméra (scan live) ───────────────────────────── */
async function startScanner(){
  const wrap=document.getElementById('scanner-wrap');
  const video=document.getElementById('scanner-video');
  document.getElementById('result').style.display='none';
  try{
    scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    video.srcObject=scanStream;
    await video.play();
    wrap.style.display='block';
    document.getElementById('btn-scan-open').style.display='none';
    setScanStatus('🔍 Pointez le QR code sur l\'attestation…');
    scanLoop=requestAnimationFrame(scanFrame);
  }catch(e){ alert('Impossible d\'accéder à la caméra. Vérifiez les permissions.'); }
}

function stopScanner(){
  if(scanLoop) cancelAnimationFrame(scanLoop);
  if(scanStream) scanStream.getTracks().forEach(t=>t.stop());
  scanStream=null; scanLoop=null;
  document.getElementById('scanner-wrap').style.display='none';
  document.getElementById('btn-scan-open').style.display='flex';
  setScanStatus('');
}

function scanFrame(){
  const video=document.getElementById('scanner-video');
  const canvas=document.getElementById('scanner-canvas');
  if(video.readyState!==video.HAVE_ENOUGH_DATA){scanLoop=requestAnimationFrame(scanFrame);return;}
  canvas.width=video.videoWidth; canvas.height=video.videoHeight;
  const ctx=canvas.getContext('2d');
  ctx.drawImage(video,0,0,canvas.width,canvas.height);
  const img=ctx.getImageData(0,0,canvas.width,canvas.height);
  const code=jsQR(img.data,img.width,img.height,{inversionAttempts:'dontInvert'});
  if(code){ stopScanner(); handleQrResult(code.data); }
  else{ scanLoop=requestAnimationFrame(scanFrame); }
}

/* ─── Upload image QR ──────────────────────────────── */
function handleQrUpload(input){
  const file=input.files[0]; if(!file) return;
  const prev=document.getElementById('upload-preview');
  const reader=new FileReader();
  reader.onload=function(e){
    const img=new Image();
    img.onload=function(){
      // Afficher aperçu
      prev.src=e.target.result; prev.style.display='block';
      // Décoder QR
      const canvas=document.createElement('canvas');
      canvas.width=img.width; canvas.height=img.height;
      const ctx=canvas.getContext('2d');
      ctx.drawImage(img,0,0);
      const imgData=ctx.getImageData(0,0,canvas.width,canvas.height);
      const code=jsQR(imgData.data,imgData.width,imgData.height,{inversionAttempts:'attemptBoth'});
      if(code){ handleQrResult(code.data); }
      else{
        setScanStatus('');
        document.getElementById('result').style.display='block';
        document.getElementById('result').innerHTML=`<div class="result-notfound">
          <div style="font-size:2.5rem;margin-bottom:.5rem">🔎</div>
          <p style="font-weight:800;color:#dc2626;margin-bottom:.25rem">QR code non détecté</p>
          <p style="color:#9b1c1c;font-size:.85rem">Assurez-vous que le QR code est net et visible. Utilisez la vérification manuelle.</p>
        </div>`;
      }
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
  // Reset pour permettre re-upload du même fichier
  input.value='';
}

/* ─── Paramètre URL ?npi= ──────────────────────────── */
(function(){
  const p=new URLSearchParams(location.search);
  const npi=p.get('npi');
  if(npi&&/^\d{13}$/.test(npi)){
    document.getElementById('v-npi').value=npi;
    const fn=p.get('fn'); const ln=p.get('ln'); const course=p.get('course');
    if(fn) document.getElementById('v-prenom').value=fn;
    if(ln) document.getElementById('v-nom').value=ln;
    if(course) document.getElementById('v-course').value=course;
  }
})();
</script>
