<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inscription – RIVO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; }
    .gradient-hero { background: linear-gradient(135deg, #1e3a8a 0%, #2563EB 55%, #3b82f6 100%); }
    .input-field { width:100%; padding:.75rem 1rem; border:2px solid #e5e7eb; border-radius:.75rem; outline:none; transition:border-color .2s; font-size:.95rem; }
    .input-field:focus { border-color:#2563EB; }
    .input-with-icon { position:relative; }
    .input-with-icon .icon { position:absolute; left:.75rem; top:50%; transform:translateY(-50%); color:#9ca3af; pointer-events:none; }
    .input-with-icon input { padding-left:2.75rem; }
    .btn { width:100%; padding:.875rem; border-radius:.75rem; font-weight:600; font-size:1rem; cursor:pointer; border:none; transition:all .2s; }
    .btn-accent { background:#F59E0B; color:white; }
    .btn-accent:hover { background:#D97706; }
    .btn-accent:disabled { opacity:.7; cursor:not-allowed; }
    .error-msg { color:#ef4444; font-size:.8rem; margin-top:.25rem; display:none; }
    .toast { position:fixed; top:1.5rem; right:1.5rem; padding:.875rem 1.25rem; border-radius:.875rem; font-weight:600; color:white; z-index:999; animation:slideIn .3s ease; max-width:320px; }
    .toast.success { background:#10b981; }
    .toast.error { background:#ef4444; }
    @keyframes slideIn { from{transform:translateX(100px);opacity:0} to{transform:translateX(0);opacity:1} }
    .spinner { width:1.25rem; height:1.25rem; border:2px solid rgba(255,255,255,.3); border-top-color:white; border-radius:50%; animation:spin .7s linear infinite; display:inline-block; }
    @keyframes spin { to{transform:rotate(360deg)} }
    label { display:block; font-size:.875rem; font-weight:600; color:#374151; margin-bottom:.375rem; }
  </style>
</head>
<body>
  <div id="toast-container"></div>

  <div class="gradient-hero min-h-screen flex items-center justify-center px-4 py-10">
    <div class="w-full max-w-lg">
      <div class="text-center mb-8">
        <a href="./index.html" class="inline-flex items-center gap-2 mb-4">
          <div class="w-12 h-12 rounded-2xl flex items-center justify-center" style="background:rgba(255,255,255,.2)">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="white" stroke-width="2"><path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
          </div>
          <span class="text-3xl font-black text-white">RIVO</span>
        </a>
        <h1 class="text-2xl font-bold text-white">Créer un compte</h1>
        <p style="color:#93c5fd" class="mt-1">Rejoignez des milliers d'apprenants</p>
      </div>

      <div class="bg-white rounded-3xl p-8 shadow-2xl">
        <form id="register-form" class="space-y-4">
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label>Prénom</label>
              <div class="input-with-icon">
                <svg class="icon w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <input type="text" id="first_name" class="input-field" placeholder="Jean" required />
              </div>
              <div class="error-msg" id="fn-error">Prénom requis (min 2 caractères)</div>
            </div>
            <div>
              <label>Nom</label>
              <div class="input-with-icon">
                <svg class="icon w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <input type="text" id="last_name" class="input-field" placeholder="Dupont" required />
              </div>
              <div class="error-msg" id="ln-error">Nom requis (min 2 caractères)</div>
            </div>
          </div>
          <div>
            <label>Adresse email</label>
            <div class="input-with-icon">
              <svg class="icon w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
              <input type="email" id="email" class="input-field" placeholder="votre@email.com" required />
            </div>
            <div class="error-msg" id="email-error">Email invalide</div>
          </div>
          <div>
            <label>Date de naissance</label>
            <div class="input-with-icon">
              <svg class="icon w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
              <input type="date" id="birth_date" class="input-field" required />
            </div>
          </div>
          <div>
            <label>Mot de passe</label>
            <div class="input-with-icon" style="position:relative">
              <svg class="icon w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input type="password" id="password" class="input-field" placeholder="Min. 8 caractères" required style="padding-left:2.75rem;padding-right:2.75rem" />
              <button type="button" onclick="togglePwd('password')" style="position:absolute;right:.75rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#9ca3af">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <div class="error-msg" id="pwd-error">Minimum 8 caractères</div>
          </div>
          <div>
            <label>Confirmer le mot de passe</label>
            <div class="input-with-icon">
              <svg class="icon w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input type="password" id="confirm_password" class="input-field" placeholder="••••••••" required />
            </div>
            <div class="error-msg" id="cpwd-error">Les mots de passe ne correspondent pas</div>
          </div>
          <div>
            <label>Code de parrainage <span style="color:#9ca3af;font-weight:400">(optionnel)</span></label>
            <div class="input-with-icon">
              <svg class="icon w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><path d="M12 22V7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>
              <input type="text" id="referral_code" class="input-field" placeholder="Ex: RIVO2024" style="text-transform:uppercase" />
            </div>
          </div>
          <button type="submit" id="submit-btn" class="btn btn-accent flex items-center justify-center gap-2 mt-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
            Créer mon compte
          </button>
        </form>
        <p class="text-center text-gray-500 mt-5 text-sm">
          Déjà inscrit ?
          <a href="./login.html" class="text-blue-600 font-semibold hover:underline ml-1">Se connecter</a>
        </p>
      </div>
    </div>
  </div>

  <script src="./config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    const SUPABASE_URL = window.RIVO_CONFIG.SUPABASE_URL;
    const SUPABASE_ANON_KEY = window.RIVO_CONFIG.SUPABASE_ANON_KEY;
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Redirect if already logged in
    supabase.auth.getSession().then(({ data: { session } }) => {
      if (session) window.location.href = './dashboard.html';
    });

    // Pre-fill referral code from URL
    const urlRef = new URLSearchParams(window.location.search).get('ref');
    if (urlRef) document.getElementById('referral_code').value = urlRef.toUpperCase();

    function showToast(msg, type = 'success') {
      const el = document.createElement('div');
      el.className = `toast ${type}`;
      el.textContent = msg;
      document.getElementById('toast-container').appendChild(el);
      setTimeout(() => el.remove(), 5000);
    }

    function showError(id, show) {
      document.getElementById(id).style.display = show ? 'block' : 'none';
    }

    function setLoading(loading) {
      const btn = document.getElementById('submit-btn');
      btn.disabled = loading;
      btn.innerHTML = loading
        ? '<span class="spinner"></span> Création...'
        : '<svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg> Créer mon compte';
    }

    function togglePwd(id) {
      const input = document.getElementById(id);
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fn = document.getElementById('first_name').value.trim();
      const ln = document.getElementById('last_name').value.trim();
      const email = document.getElementById('email').value.trim();
      const birth = document.getElementById('birth_date').value;
      const pwd = document.getElementById('password').value;
      const cpwd = document.getElementById('confirm_password').value;
      const refCode = document.getElementById('referral_code').value.trim().toUpperCase();

      // Validate
      let valid = true;
      showError('fn-error', fn.length < 2); if (fn.length < 2) valid = false;
      showError('ln-error', ln.length < 2); if (ln.length < 2) valid = false;
      showError('email-error', !email.includes('@')); if (!email.includes('@')) valid = false;
      showError('pwd-error', pwd.length < 8); if (pwd.length < 8) valid = false;
      showError('cpwd-error', pwd !== cpwd); if (pwd !== cpwd) valid = false;
      if (!valid) return;

      setLoading(true);

      // Check referral code if provided
      let referredById = null;
      if (refCode) {
        const { data: referrer } = await supabase
          .from('profiles')
          .select('id')
          .eq('referral_code', refCode)
          .single();
        if (!referrer) {
          showToast('Code de parrainage invalide', 'error');
          setLoading(false);
          return;
        }
        referredById = referrer.id;
      }

      const { data: authData, error } = await supabase.auth.signUp({
        email,
        password: pwd,
        options: {
          data: { first_name: fn, last_name: ln }
        }
      });

      if (error) {
        showToast(error.message || 'Erreur lors de l\'inscription', 'error');
        setLoading(false);
        return;
      }

      // Update profile with extra data
      if (authData.user) {
        await supabase.from('profiles').update({
          first_name: fn,
          last_name: ln,
          birth_date: birth,
          referred_by: referredById
        }).eq('id', authData.user.id);
      }

      showToast('Compte créé avec succès ! Bienvenue sur RIVO 🎉');
      setTimeout(() => { window.location.href = './dashboard.html'; }, 1200);
    });
  </script>
</body>
</html>
