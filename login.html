<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion – RIVO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; }
    .gradient-hero { background: linear-gradient(135deg, #1e3a8a 0%, #2563EB 55%, #3b82f6 100%); }
    .input-field { width:100%; padding:.75rem 1rem; border: 2px solid #e5e7eb; border-radius:.75rem; outline:none; transition:border-color .2s; font-size:.95rem; }
    .input-field:focus { border-color:#2563EB; }
    .input-with-icon { position:relative; }
    .input-with-icon .icon { position:absolute; left:.75rem; top:50%; transform:translateY(-50%); color:#9ca3af; pointer-events:none; }
    .input-with-icon input { padding-left:2.75rem; }
    .btn { width:100%; padding:.875rem; border-radius:.75rem; font-weight:600; font-size:1rem; cursor:pointer; border:none; transition:all .2s; }
    .btn-primary { background:#2563EB; color:white; }
    .btn-primary:hover { background:#1D4ED8; }
    .btn-primary:disabled { opacity:.7; cursor:not-allowed; }
    .btn-accent { background:#F59E0B; color:white; }
    .btn-accent:hover { background:#D97706; }
    .error-msg { color:#ef4444; font-size:.8rem; margin-top:.25rem; }
    .toast { position:fixed; top:1.5rem; right:1.5rem; padding:.875rem 1.25rem; border-radius:.875rem; font-weight:600; color:white; z-index:999; animation:slideIn .3s ease; max-width:320px; }
    .toast.success { background:#10b981; }
    .toast.error { background:#ef4444; }
    @keyframes slideIn { from{transform:translateX(100px);opacity:0} to{transform:translateX(0);opacity:1} }
    .spinner { width:1.25rem; height:1.25rem; border:2px solid rgba(255,255,255,.3); border-top-color:white; border-radius:50%; animation:spin .7s linear infinite; display:inline-block; }
    @keyframes spin { to{transform:rotate(360deg)} }
  </style>
</head>
<body>
  <div id="toast-container"></div>

  <div class="gradient-hero min-h-screen flex items-center justify-center px-4 py-10">
    <div class="w-full max-w-md">
      <!-- Logo -->
      <div class="text-center mb-8">
        <a href="./index.html" class="inline-flex items-center gap-2 mb-4">
          <div class="w-12 h-12 rounded-2xl flex items-center justify-center" style="background:rgba(255,255,255,.2);backdrop-filter:blur(8px)">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="white" stroke-width="2"><path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
          </div>
          <span class="text-3xl font-black text-white">RIVO</span>
        </a>
        <h1 class="text-2xl font-bold text-white">Bienvenue !</h1>
        <p style="color:#93c5fd" class="mt-1">Connectez-vous à votre compte</p>
      </div>

      <!-- Card -->
      <div class="bg-white rounded-3xl p-8 shadow-2xl">
        <form id="login-form" class="space-y-5">
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1.5">Adresse email</label>
            <div class="input-with-icon">
              <svg class="icon w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
              <input type="email" id="email" class="input-field" placeholder="votre@email.com" required />
            </div>
            <div class="error-msg" id="email-error"></div>
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1.5">Mot de passe</label>
            <div class="input-with-icon" style="position:relative">
              <svg class="icon w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input type="password" id="password" class="input-field" placeholder="••••••••" required style="padding-left:2.75rem;padding-right:2.75rem" />
              <button type="button" onclick="togglePwd()" style="position:absolute;right:.75rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#9ca3af">
                <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <div class="error-msg" id="pwd-error"></div>
          </div>
          <button type="submit" id="submit-btn" class="btn btn-primary flex items-center justify-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
            Se connecter
          </button>
        </form>
        <p class="text-center text-gray-500 mt-6 text-sm">
          Pas encore de compte ?
          <a href="./register.html" class="text-blue-600 font-semibold hover:underline ml-1">S'inscrire gratuitement</a>
        </p>
      </div>
    </div>
  </div>

  <script src="./config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    const SUPABASE_URL = window.RIVO_CONFIG.SUPABASE_URL;
    const SUPABASE_ANON_KEY = window.RIVO_CONFIG.SUPABASE_ANON_KEY;
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function showToast(msg, type = 'success') {
      const el = document.createElement('div');
      el.className = `toast ${type}`;
      el.textContent = msg;
      document.getElementById('toast-container').appendChild(el);
      setTimeout(() => el.remove(), 4000);
    }

    function setLoading(loading) {
      const btn = document.getElementById('submit-btn');
      btn.disabled = loading;
      btn.innerHTML = loading
        ? '<span class="spinner"></span> Connexion...'
        : '<svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg> Se connecter';
    }

    function togglePwd() {
      const input = document.getElementById('password');
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    // Redirect if already logged in
    supabase.auth.getSession().then(({ data: { session } }) => {
      if (session) window.location.href = './dashboard.html';
    });

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      document.getElementById('email-error').textContent = '';
      document.getElementById('pwd-error').textContent = '';

      if (!email) { document.getElementById('email-error').textContent = 'Email requis'; return; }
      if (!password) { document.getElementById('pwd-error').textContent = 'Mot de passe requis'; return; }

      setLoading(true);

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });

      if (error) {
        showToast('Email ou mot de passe incorrect', 'error');
        setLoading(false);
        return;
      }

      // Check if admin
      const { data: profile } = await supabase
        .from('profiles')
        .select('badge_level')
        .eq('id', data.user.id)
        .single();

      showToast('Connexion réussie ! 🎉');
      setTimeout(() => {
        if (profile?.badge_level === 'admin') {
          window.location.href = './admin.html';
        } else {
          window.location.href = './dashboard.html';
        }
      }, 800);
    });
  </script>
</body>
</html>
